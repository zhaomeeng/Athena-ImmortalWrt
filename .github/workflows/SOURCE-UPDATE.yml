name: Athena Update Sources
run-name: Athena - update source locks only
on:
  schedule:
    - cron: '20 3 * * *' # 11:20 Asia/Shanghai
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check and report proposed source changes without committing
        type: boolean
        default: true
        required: true
permissions:
  contents: write
concurrency:
  group: athena-source-update-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true # Only this metadata job commits; post-checkout removes the token.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test source update guards
        run: node --test tests/source-update.test.mjs
      - name: Resolve released source and feed locks
        id: sources
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=()
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          node Scripts/Athena-sources.mjs "${args[@]}"
      - name: Commit source locks and version documentation
        if: ${{ steps.sources.outputs.changed == 'true' }}
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_COMMIT: ${{ steps.sources.outputs.source_commit }}
        run: |
          git add -- build.lock.tsv sources/upstream.json README.md
          while IFS= read -r file; do
            case "$file" in
              build.lock.tsv|sources/upstream.json|README.md) ;;
              *) echo 'Unexpected staged file; stop.' >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '自动更新雅典娜源码与依赖版本锁' \
            -m "源码提交：$SOURCE_COMMIT；仅更新构建来源，固件待手动编译。"
          git push origin "HEAD:$TARGET_BRANCH"
      - name: Save source update report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athena-source-update-${{ github.run_id }}
          path: artifacts/source-update/
          retention-days: 14
          if-no-files-found: ignore
