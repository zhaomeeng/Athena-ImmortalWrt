name: Athena Build Firmware
run-name: Athena - ${{ inputs.preview && 'defconfig preview' || 'firmware build' }}
on:
  workflow_dispatch:
    inputs:
      preview:
        description: Validate configuration and checkpoint restore; do not compile firmware
        type: boolean
        default: true
        required: true
      checkpoint_run_id:
        description: Optional completed toolchain run to reuse; input hashes must match
        type: string
        default: ''
        required: false
permissions:
  contents: write
  actions: write
concurrency:
  group: athena-b-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      repo: ${{ steps.locked.outputs.repo }}
      name: ${{ steps.locked.outputs.name }}
      branch: ${{ steps.locked.outputs.branch }}
      release_tag: ${{ steps.release.outputs.tag }}
      checkpoint_run_id: ${{ steps.resume.outputs.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test build source and checkpoint guards
        run: node --test tests/source-update.test.mjs tests/release-name.test.mjs tests/resume.test.mjs
      - name: Validate locked source provenance
        id: locked
        run: node Scripts/Athena-sources.mjs --resolve-build
      - name: Resolve dated release name and prevent replacement
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node Scripts/Athena-release-name.mjs
      - name: Validate preceding completed toolchain run
        if: ${{ inputs.checkpoint_run_id != '' }}
        id: resume
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_RUN_ID: ${{ inputs.checkpoint_run_id }}
          PREVIEW: ${{ inputs.preview }}
        run: node Scripts/Athena-resume.mjs
  toolchain:
    needs: source
    if: ${{ needs.source.outputs.checkpoint_run_id == '' }}
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: IPQ60XX-WIFI-YES
      WRT_THEME: aurora
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: '12345678'
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: ${{ needs.source.outputs.repo }}
      WRT_BRANCH: ${{ needs.source.outputs.branch }}
      WRT_SOURCE: ${{ needs.source.outputs.name }}
      WRT_STAGE: toolchain
      WRT_RELEASE_TAG: ${{ needs.source.outputs.release_tag }}
      WRT_TEST: ${{ inputs.preview }}
  athena:
    needs: [source, toolchain]
    if: ${{ always() && needs.source.result == 'success' && (needs.toolchain.result == 'success' || (needs.toolchain.result == 'skipped' && needs.source.outputs.checkpoint_run_id != '')) }}
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: IPQ60XX-WIFI-YES
      WRT_THEME: aurora
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: '12345678'
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: ${{ needs.source.outputs.repo }}
      WRT_BRANCH: ${{ needs.source.outputs.branch }}
      WRT_SOURCE: ${{ needs.source.outputs.name }}
      WRT_STAGE: firmware
      WRT_RELEASE_TAG: ${{ needs.source.outputs.release_tag }}
      WRT_CHECKPOINT_STAGE: toolchain
      WRT_CHECKPOINT_RUN_ID: ${{ needs.source.outputs.checkpoint_run_id }}
      WRT_TEST: ${{ inputs.preview }}
